<!doctype html>
<html><head><meta charset="utf-8"><title>model placement inspect</title>
<style>html,body{margin:0;background:#101216;color:#cfd3da;font:12px/1.3 ui-monospace,monospace}
#c{display:block}#legend{position:fixed;left:8px;top:8px}
b.k{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:9px}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js","three/addons/":"../../vendor/jsm/"}}</script>
</head><body>
<div id="legend"></div><canvas id="c"></canvas>
<script type="module">
// Renders what derive-placement.mjs computed, one model per row, side-on. It is a LOOK at the numbers,
// not a way to edit them: the placement is derived from geometry and pinned in OVERRIDE when wrong.
//   ?ids=guns/shotgun,guns/revolver   which models (default: the ones the game wires)
//   ?view=side|top                    side is x/y, top is x/z
import * as THREE from 'three';
import { loadModels, build, hasModel } from '../../src/models/glb.js';

const Q = new URLSearchParams(location.search);
const WIRED = ['guns/assault-rifle','guns/sniper-rifle','guns/revolver','guns/shotgun','guns/submachine-gun','guns/bullpup','guns/pistol'];
const ids = (Q.get('ids') || WIRED.join(',')).split(',').filter(Boolean);
const top = Q.get('view') === 'top';

const place = await (await fetch('../../assets/models/placement-data.json')).json();
await loadModels(ids, '../../');

const cv = document.getElementById('c');
// preserveDrawingBuffer: the page renders once rather than in a loop, so without it a screenshot taken
// after the frame has been composited reads an empty buffer. autoClear off for the same reason the
// viewports are scissored — each row draws into the same buffer and must not wipe the row above it.
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.autoClear = false;
const W = 1400, ROW = 200, H = ROW * ids.length;
renderer.setSize(W, H); renderer.setClearColor(0x101216);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 4, 6); scene.add(dl);

const MARK = { grip: 0xffd400, dir: 0x2f6fff, tip: 0xff2020, front: 0x25e04a, rear: 0xc040ff };
function dot(p, col, r){ const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), new THREE.MeshBasicMaterial({ color: col }));
  m.position.set(p[0], p[1], p[2]); return m; }

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
let y = 0;
const rows = [];
for (const id of ids){
  const d = place.models[id]; if (!d || !hasModel(id)) { console.warn('missing', id); continue; }
  const g = build(id);
  const grp = new THREE.Group(); grp.add(g); scene.add(grp);
  const S = Math.max(...d.bbox.size);
  const r = Math.max(d.bbox.size[1], d.bbox.size[2]) * 0.035;   // sized off the row's own scale (height-fit), so a marker is the same size on screen for a pistol and a rifle
  if (d.gripPoint) grp.add(dot(d.gripPoint.position, MARK.grip, r * 1.3));
  if (d.barrelTip) grp.add(dot(d.barrelTip.position, MARK.tip, r));
  if (d.frontSight) grp.add(dot(d.frontSight.position, MARK.front, r));
  if (d.rearSight) grp.add(dot(d.rearSight.position, MARK.rear, r));
  if (d.directionIndicator) grp.add(dot(d.directionIndicator.position, MARK.dir, r * 0.9));
  if (d.boreY != null){   // the bore line the sights are supposed to stand over
    const L = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(d.bbox.min[0], d.boreY, 0), new THREE.Vector3(d.bbox.max[0] + S * 0.1, d.boreY, 0)]),
      new THREE.LineBasicMaterial({ color: 0x445066 })); grp.add(L);
  }
  rows.push({ id, grp, d, S });
}
document.getElementById('legend').innerHTML = Object.entries(MARK)
  .map(([k, c]) => '<b class="k" style="background:#' + c.toString(16).padStart(6, '0') + '"></b>' + k).join(' &nbsp; ')
  + '<br>' + rows.map((r, i) => (i + 1) + '. ' + r.id).join('<br>');

renderer.clear();
renderer.setScissorTest(true);
for (let i = 0; i < rows.length; i++){
  const { grp, d, S } = rows[i];
  const cx = (d.bbox.min[0] + d.bbox.max[0]) / 2, cy = (d.bbox.min[1] + d.bbox.max[1]) / 2, cz = 0;
  // FIT THE ROW'S HEIGHT, not its width. A row is 7:1 and a rifle is 3:1, so fitting the length put the
  // gun's full height outside the strip and every model bled into its neighbour.
  const halfH = Math.max(d.bbox.size[1], d.bbox.size[2]) * 0.62, halfW = halfH * W / ROW;
  cam.left = -halfW; cam.right = halfW; cam.top = halfH; cam.bottom = -halfH; cam.updateProjectionMatrix();
  if (top){ cam.position.set(cx, 20, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz); }
  else { cam.position.set(cx, cy, 20); cam.up.set(0, 1, 0); cam.lookAt(cx, cy, 0); }
  renderer.setViewport(0, H - ROW * (i + 1), W, ROW);
  renderer.setScissor(0, H - ROW * (i + 1), W, ROW);
  for (const r of rows) r.grp.visible = (r === rows[i]);
  renderer.render(scene, cam);
}
renderer.setScissorTest(false);
window.__ready = true;
</script></body></html>
